<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Subtle Dark Indigo Depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Flow Accent Gradient for the B silhouette -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Canvas (Safe Margins) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Minimalist Geometric Letter 'B' with Flowing Wave Arc -->
  <g filter="url(#subtleGlow)" transform="translate(136, 116)">
    <!-- Vertical stem with rounded caps -->
    <rect x="0" y="0" width="48" height="280" rx="24" fill="url(#flowGrad)" />

    <!-- Top loop of B with aerodynamic flow curve -->
    <path d="M 40,0 L 128,0 C 185,0 216,32 216,76 C 216,120 185,148 128,148 L 40,148 Z" 
          fill="none" 
          stroke="url(#flowGrad)" 
          stroke-width="44" 
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Bottom loop of B with wider dynamic flow sweep -->
    <path d="M 40,140 L 140,140 C 205,140 240,172 240,218 C 240,264 205,280 140,280 L 40,280 Z" 
          fill="none" 
          stroke="url(#flowGrad)" 
          stroke-width="44" 
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Flow Accent Wave through the center waist -->
    <circle cx="128" cy="144" r="14" fill="url(#waveGrad)" />
  </g>
</svg>
